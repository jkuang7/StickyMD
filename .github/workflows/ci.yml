name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-directories: /tmp/stickymd-sandcastle-target
      - run: npm ci
      # Run the same commands Sandcastle gates on, so CI cannot drift from sandcastle.json.
      - name: sandcastle checks
        run: |
          node -e 'const {spawnSync}=require("node:child_process");const c=require("./sandcastle.json");for(const k of ["typecheck","test"]){const [cmd,...a]=c[k];const r=spawnSync(cmd,a,{stdio:"inherit"});if(r.status!==0)process.exit(r.status??1)}'
